name: Update Citation Counts

on:
  schedule:
    - cron: '0 3 * * 1'   # weekly, Monday 03:00 UTC
  workflow_dispatch:        # allow manual runs

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # this workflow pushes to the repository
      actions: write           # ...and dispatches the Pages deploy afterwards

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests pyyaml

    - name: Update citation counts
      run: python scripts/update_citations.py

    - name: Commit changes
      id: commit
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add _data/citations.yml
        if git commit -m "Automated update of citation counts"; then
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        else
          echo "No changes to commit"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
        fi

    # Pushes made with GITHUB_TOKEN do not trigger the pages.yml push workflow,
    # so dispatch the deploy explicitly when new data was committed.
    - name: Trigger Pages deploy
      if: steps.commit.outputs.pushed == 'true'
      run: gh workflow run pages.yml --ref master
      env:
        GH_TOKEN: ${{ github.token }}
